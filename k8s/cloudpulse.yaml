apiVersion: v1
kind: Namespace
metadata:
  name: cloudpulse
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: cloudpulse
data:
  rabbitmq.conf: |
    loopback_users.guest = false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: cloudpulse
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: cloudpulse
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cloudpulse
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}
            - {name: POSTGRES_DB, value: cloudpulse}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe: {exec: {command: [sh, -c, pg_isready -U postgres -d cloudpulse]}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {exec: {command: [sh, -c, pg_isready -U postgres -d cloudpulse]}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cloudpulse
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: cloudpulse
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      securityContext: {fsGroup: 999}
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports: [{containerPort: 5672}, {containerPort: 15672}, {containerPort: 15692}]
          volumeMounts:
            - {name: config, mountPath: /etc/rabbitmq/rabbitmq.conf, subPath: rabbitmq.conf}
            - {name: data, mountPath: /var/lib/rabbitmq}
          readinessProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, initialDelaySeconds: 8, periodSeconds: 5}
          livenessProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, initialDelaySeconds: 20, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes:
        - {name: config, configMap: {name: rabbitmq-config}}
        - {name: data, persistentVolumeClaim: {claimName: rabbitmq-data}}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: cloudpulse
spec:
  clusterIP: None
  selector: {app: rabbitmq}
  ports: [{name: amqp, port: 5672, targetPort: 5672}]
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: cloudpulse
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: management, port: 15672, targetPort: 15672}
    - {name: metrics, port: 15692, targetPort: 15692}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-api
  namespace: cloudpulse
spec:
  replicas: 2
  selector:
    matchLabels: {app: cloudpulse-api}
  template:
    metadata:
      labels: {app: cloudpulse-api}
    spec:
      containers:
        - name: api
          image: cloudpulse:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: DATABASE_URL, value: postgresql+psycopg://postgres@postgres:5432/cloudpulse}
            - {name: RABBITMQ_URL, value: amqp://guest:guest@rabbitmq:5672/%2F}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-api
  namespace: cloudpulse
spec:
  selector: {app: cloudpulse-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-worker
  namespace: cloudpulse
spec:
  replicas: 3
  selector:
    matchLabels: {app: cloudpulse-worker}
  template:
    metadata:
      labels: {app: cloudpulse-worker}
    spec:
      containers:
        - name: worker
          image: cloudpulse:dev
          imagePullPolicy: IfNotPresent
          command: [python, -m, app.worker]
          env:
            - {name: DATABASE_URL, value: postgresql+psycopg://postgres@postgres:5432/cloudpulse}
            - {name: RABBITMQ_URL, value: amqp://guest:guest@rabbitmq:5672/%2F}
            - {name: PROCESSING_DELAY_MS, value: "20"}
          ports: [{containerPort: 9100}]
          readinessProbe: {tcpSocket: {port: 9100}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 9100}, initialDelaySeconds: 15, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
